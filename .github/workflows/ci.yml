name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── 1. Python formatting ────────────────────────────────────────────────────
  lint-python-format:
    name: "Lint · black (formatting)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install black
        run: pip install "black>=24.0"
      - name: Check formatting
        run: black --check --diff .

  # ── 2. Python style / imports ───────────────────────────────────────────────
  lint-python-ruff:
    name: "Lint · ruff (style)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.4"
      - name: Check style
        run: ruff check .

  # ── 3. Unit tests (fully mocked, no credentials needed) ─────────────────────
  unit-tests:
    name: "Test · pytest unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest requests "python-dotenv" "loguru>=0.7" "boto3>=1.34"
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  # ── 4. Great Expectations source data validation ────────────────────────────
  gx-source-tests:
    name: "Test · GX source data validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pandas "great-expectations>=1.0"
      - name: Run GX source data tests
        run: pytest tests/gx/ -v --tb=short
