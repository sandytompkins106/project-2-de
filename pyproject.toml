[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | dbt_packages
  | target
  | output
  | logs
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["dbt_packages", "target", ".venv", "output", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length — enforced by black
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.dagster]
module_name = "data_orchestration"
working_directory = "data_orchestration"
