version: 2

models:
  - name: dim_repos
    description: "One row per unique repository - latest snapshot"
    columns:
      - name: repo_key
        tests:
          - not_null
          - unique
      - name: repo_id
        tests:
          - not_null
          - unique
      - name: full_name
        tests:
          - not_null
          - unique
      - name: owner_login
        tests:
          - not_null

  - name: dim_developers
    description: "All unique developers seen across repos, PRs, and issues"
    columns:
      - name: developer_key
        tests:
          - not_null
          - unique
      - name: developer_id
        tests:
          - not_null
          - unique
      - name: developer_login
        tests:
          - not_null

  - name: dim_date
    description: "Date spine from 2020 to 2030"
    columns:
      - name: date_id
        tests:
          - not_null
          - unique
      - name: year
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 2020"

  - name: fact_repo_snapshots
    description: "One row per repo per extraction run - point-in-time metrics"
    columns:
      - name: snapshot_id
        tests:
          - not_null
          - unique
      - name: repo_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_repos')
              field: repo_key
      - name: developer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: stargazers_count
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: forks_count
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fact_pull_requests
    description: "One row per pull request per extraction run"
    columns:
      - name: pr_snapshot_id
        tests:
          - not_null
          - unique
      - name: developer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: state
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: hours_to_close
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "hours_to_close is not null"

  - name: fact_issues
    description: "One row per issue per extraction run"
    columns:
      - name: issue_snapshot_id
        tests:
          - not_null
          - unique
      - name: developer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: state
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: hours_to_close
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "hours_to_close is not null"
