version: 2

snapshots:
  - name: dim_repos_snapshot
    description: |
      SCD2 snapshot of GitHub repositories. Tracks all historical changes to key attributes for each repo_id.
    tests:
      - not_null:
          column_name: repo_id
      - not_null:
          column_name: full_name
      - not_null:
          column_name: owner_login
      - not_null:
          column_name: created_at
      - accepted_values:
          column_name: visibility
          values: ["public", "private", "internal"]
      - accepted_values:
          column_name: is_fork
          values: [true, false]
      - accepted_values:
          column_name: is_archived
          values: [true, false]
      - accepted_values:
          column_name: is_disabled
          values: [true, false]
      - accepted_values:
          column_name: is_private
          values: [true, false]
      - accepted_values:
          column_name: has_issues
          values: [true, false]
      - accepted_values:
          column_name: has_wiki
          values: [true, false]
      - accepted_values:
          column_name: has_discussions
          values: [true, false]
      - accepted_values:
          column_name: has_pages
          values: [true, false]
      - dbt_utils.expression_is_true:
          expression: stargazers_count >= 0
      - dbt_utils.expression_is_true:
          expression: forks_count >= 0
      - dbt_utils.expression_is_true:
          expression: open_issues_count >= 0

models:
  - name: dim_repos
    description: "One row per unique repository - latest snapshot"
    columns:
      - name: repo_key
        tests:
          - not_null
          - unique
      - name: repo_id
        tests:
          - not_null
          - unique
      - name: full_name
        tests:
          - not_null
          - unique
      - name: owner_login
        tests:
          - not_null

  - name: dim_developers
    description: "All unique developers seen across repos, PRs, and issues"
    columns:
      - name: developer_key
        tests:
          - not_null
          - unique
      - name: developer_id
        tests:
          - not_null
          - unique
      - name: developer_login
        tests:
          - not_null

  - name: dim_date
    description: "Date spine from 2020 to 2030"
    columns:
      - name: date_id
        tests:
          - not_null
          - unique
      - name: year
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 2020"

  - name: fact_repo_snapshots
    description: "One row per repo per extraction run - point-in-time metrics"
    columns:
      - name: snapshot_id
        tests:
          - not_null
          - unique
      - name: repo_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_repos')
              field: repo_key
      - name: developer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
              config:
                severity: warn
      - name: stargazers_count
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: forks_count
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fact_pull_requests
    description: "One row per pull request per extraction run"
    columns:
      - name: pr_snapshot_id
        tests:
          - not_null
          - unique
      - name: developer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
              config:
                severity: warn
      - name: state
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: hours_to_close
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "hours_to_close is not null"

  - name: fact_issues
    description: "One row per issue per extraction run"
    columns:
      - name: issue_snapshot_id
        tests:
          - not_null
          - unique
      - name: developer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_developers')
              field: developer_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
              config:
                severity: warn
      - name: state
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: hours_to_close
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "hours_to_close is not null"

  - name: mart_trending_repos
    description: "Trending repos ranked by stars — one row per unique repo, latest snapshot"
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
    columns:
      - name: repo_id
        tests:
          - not_null
          - unique
      - name: full_name
        tests:
          - not_null
      - name: stargazers_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: forks_count
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: star_tier
        tests:
          - not_null
          - accepted_values:
              values: ['high', 'medium', 'low', 'minimal']

  - name: mart_developer_activity
    description: "Aggregated activity per developer — one row per owner"
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
    columns:
      - name: owner_login
        tests:
          - not_null
          - unique
      - name: repos_created
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 1"
      - name: total_stars
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: avg_stars_per_repo
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: mart_community_health
    description: "Community health scores per repository — one row per unique repo"
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
    columns:
      - name: repo_id
        tests:
          - not_null
          - unique
      - name: full_name
        tests:
          - not_null
      - name: health_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: tracked_issues
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: tracked_prs
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: pr_merge_rate_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              config:
                severity: warn
