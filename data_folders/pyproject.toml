[project]
name = "data_orchestration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-dbt",
    "dbt-core",
    "dbt-snowflake",
    "requests",
    "python-dotenv",
    "boto3>=1.34.0",
    "dagster-airbyte",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]
streaming = [
    "confluent-kafka>=2.4.0",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_orchestration", "data_integration"]

[tool.dagster]
module_name = "data_orchestration.definitions"
code_location_name = "data_orchestration"
