[project]
name = "data_integration"
version = "0.1.0"
description = "GitHub API extraction pipeline"
requires-python = ">=3.10,<3.15"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv",
    "boto3>=1.34.0",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
